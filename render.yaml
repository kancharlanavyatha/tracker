services:
  - type: web
    name: menstrual-tracker-app
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: menstrual-health-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SCHEDULER_ENABLED
        value: "true"

databases:
  - name: menstrual-health-db
    plan: free
    region: oregon
    databaseName: menstrual_health
    user: tracker_user
