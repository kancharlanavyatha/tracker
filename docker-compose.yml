services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cycleapp
      POSTGRES_PASSWORD: cycleapp
      POSTGRES_DB: menstrual_health
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cycleapp -d menstrual_health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
